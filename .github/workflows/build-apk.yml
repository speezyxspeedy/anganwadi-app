name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build
        env:
          CI: false
          NEXT_TELEMETRY_DISABLED: 1

      - name: Sync Capacitor
        run: npx cap sync android || echo "Sync bypassed"

      - name: Fix Missing Icons & Res
        run: |
          TARGET_DIR="android/app/src/main/res/mipmap-anydpi-v26"
          mkdir -p "$TARGET_DIR"
          
          # Default adaptive XML icon create kar rahe hain
          cat << 'EOF' > "$TARGET_DIR/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="@android:color/white"/>
              <foreground android:color="@android:color/black"/>
          </adaptive-icon>
          EOF
          
          cp "$TARGET_DIR/ic_launcher.xml" "$TARGET_DIR/ic_launcher_round.xml"

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anganwadi-app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 7
